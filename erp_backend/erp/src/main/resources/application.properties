spring.application.name=erp
server.port=8080

# Load local .env from the module root (erp) when present, from either the
# module dir (Maven CLI) or the IntelliJ project dir (erp_backend).
# Values use the normal KEY=VALUE format. The file is ignored by Git.
spring.config.import=optional:file:./.env[.properties],optional:file:./erp/.env[.properties]

# En dev, le mot de passe par defaut est celui du container Docker.
# En production, set DB_PASSWORD in your environment before starting:
#   PowerShell:  $env:DB_PASSWORD="your_password"
spring.datasource.url=jdbc:postgresql://localhost:5433/erp_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:erpdev1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# HS256 secret (min 32 bytes). Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32-bytes-min!!}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

app.cors.allowed-origins=http://localhost:4200

# Password reset emails (Gmail SMTP by default).
# Set the values in .env; never commit real credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@erp.local}
app.password-reset.code-ttl-minutes=15
app.password-reset.max-attempts=5
app.password-reset.resend-cooldown-seconds=60

# KYC documents (local filesystem)
app.kyc.storage-dir=${KYC_STORAGE_DIR:./uploads/images}
app.kyc.max-file-size-kb=2048

# Never commit real secrets. Set these values in your shell/IDE.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:4200/signup/success}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:4200/signup/payment-cancelled}
app.stripe.portal-return-url=${STRIPE_PORTAL_RETURN_URL:http://localhost:4200/settings/billing}
app.stripe.price.starter.monthly=${STRIPE_PRICE_STARTER_MONTHLY:}
app.stripe.price.starter.annual=${STRIPE_PRICE_STARTER_ANNUAL:}
app.stripe.price.business.monthly=${STRIPE_PRICE_BUSINESS_MONTHLY:}
app.stripe.price.business.annual=${STRIPE_PRICE_BUSINESS_ANNUAL:}
app.stripe.price.enterprise.monthly=${STRIPE_PRICE_ENTERPRISE_MONTHLY:}
app.stripe.price.enterprise.annual=${STRIPE_PRICE_ENTERPRISE_ANNUAL:}

# Upload limits: four 2 MB documents plus the JSON part
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=12MB
