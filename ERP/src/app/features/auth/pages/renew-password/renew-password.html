<div class="login-page" *transloco="let t">
  <div class="login-card">
    <div class="auth-icon">
      <svg
        viewBox="0 0 24 24"
        width="30"
        height="30"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        <circle cx="12" cy="15.5" r="1.4" />
      </svg>
    </div>

    <div class="login-header">
      <h1 class="login-title">{{ t('rbac.renewal.title') }}</h1>
      <p class="auth-text">{{ t('rbac.renewal.description') }}</p>
    </div>

    @if (session()?.email) {
      <p class="account-chip">
        <span class="account-chip-label">{{ t('rbac.renewal.signedInAs') }}</span>
        <strong>{{ session()?.email }}</strong>
      </p>
    }

    <form class="login-form" (submit)="onSubmit($event)">
      @if (errorKey()) {
        <div class="alert alert-error" role="alert">{{ t(errorKey()) }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="new-password">{{ t('rbac.renewal.newPassword') }}</label>
        <input
          id="new-password"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-control"
          [value]="newPassword()"
          (input)="onNewPasswordInput($event)"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">{{ t('rbac.renewal.confirm') }}</label>
        <input
          id="confirm-password"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-control"
          [value]="confirm()"
          (input)="onConfirmInput($event)"
          autocomplete="new-password"
          required
        />
      </div>

      <label class="show-toggle">
        <input type="checkbox" [checked]="showPassword()" (change)="onToggleShow($event)" />
        {{ t('rbac.renewal.showPassword') }}
      </label>

      <ul class="req-list">
        <li [class.ok]="lengthOk">{{ t('rbac.renewal.reqLength') }}</li>
        <li [class.ok]="matchOk">{{ t('rbac.renewal.reqMatch') }}</li>
      </ul>

      <button type="submit" class="btn btn-primary btn-lg login-btn" [disabled]="saving()">
        {{ t('rbac.renewal.submit') }}
      </button>
    </form>

    <div class="login-footer">
      <p class="login-footer-text">ERP Cloud</p>
    </div>
  </div>
</div>
