<div class="login-page" *transloco="let t">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">E</div>
      <h1 class="login-title">ERP Cloud</h1>
      <p class="login-subtitle">{{ t('rbac.renewal.title') }}</p>
    </div>

    <p class="renewal-description">{{ t('rbac.renewal.description') }}</p>

    <form class="login-form" (submit)="onSubmit($event)">
      @if (errorKey()) {
        <div class="login-error">{{ t(errorKey()) }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="new-password">{{ t('rbac.renewal.newPassword') }}</label>
        <input
          id="new-password"
          type="password"
          class="form-control"
          [value]="newPassword()"
          (input)="onNewPasswordInput($event)"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">{{ t('rbac.renewal.confirm') }}</label>
        <input
          id="confirm-password"
          type="password"
          class="form-control"
          [value]="confirm()"
          (input)="onConfirmInput($event)"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-lg login-btn" [disabled]="saving()">
        {{ t('rbac.renewal.submit') }}
      </button>
    </form>

    <p class="login-footer-text">ERP Cloud — {{ session()?.email }}</p>
  </div>
</div>
