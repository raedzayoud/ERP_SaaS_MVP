<div class="login-page" *transloco="let t">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">E</div>
      <h1 class="login-title">ERP Cloud</h1>
      @if (role; as r) {
        <p class="login-subtitle">
          {{ t('login.credentials.title', { role: t(roleKey(r)) }) }}
        </p>
      }
    </div>

    <form class="login-form" (submit)="onSubmit($event)">
      @if (errorKey()) {
        <div class="login-error">{{ t(errorKey()) }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="email">{{ t('login.credentials.email') }}</label>
        <input
          id="email"
          type="email"
          class="form-control"
          [value]="email()"
          (input)="onEmailInput($event)"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">{{ t('login.credentials.password') }}</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [placeholder]="t('login.credentials.passwordPlaceholder')"
          [value]="password()"
          (input)="onPasswordInput($event)"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="demo-hint">{{ t('login.credentials.demoHint') }}</p>

      <button type="submit" class="btn btn-primary btn-lg login-btn" [disabled]="loading()">
        @if (loading()) {
          {{ t('login.credentials.signingIn') }}
        } @else {
          {{ t('login.credentials.signIn') }}
        }
      </button>
    </form>

    <div class="login-footer">
      <p class="signup-prompt">
        <a routerLink="/login">← {{ t('login.credentials.back') }}</a>
      </p>
      <p class="login-footer-text">{{ t('login.footer') }}</p>
    </div>
  </div>
</div>
