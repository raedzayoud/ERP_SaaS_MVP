<div class="login-page" *transloco="let t">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">E</div>
      <h1 class="login-title">ERP Cloud</h1>
      <p class="login-subtitle">{{ t('rbac.login.genericTitle') }}</p>
    </div>

    <form class="login-form" (submit)="onSubmit($event)">
      @if (errorKey()) {
        <div class="login-error">{{ t(errorKey()) }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="generic-email">{{ t('rbac.login.email') }}</label>
        <input
          id="generic-email"
          type="email"
          class="form-control"
          [value]="email()"
          (input)="onEmailInput($event)"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="generic-password">{{ t('login.credentials.password') }}</label>
        <input
          id="generic-password"
          type="password"
          class="form-control"
          [placeholder]="t('login.credentials.passwordPlaceholder')"
          [value]="password()"
          (input)="onPasswordInput($event)"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="demo-hint">{{ t('rbac.login.genericHint') }}</p>

      <button type="submit" class="btn btn-primary btn-lg login-btn" [disabled]="loading()">
        {{ t('login.credentials.signIn') }}
      </button>
    </form>

    <div class="login-footer">
      <p class="signup-prompt">
        <a routerLink="/login">← {{ t('login.credentials.back') }}</a>
      </p>
      <p class="login-footer-text">{{ t('login.footer') }}</p>
    </div>
  </div>
</div>
