<div class="login-page" *transloco="let t">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">E</div>
      <h1 class="login-title">ERP Cloud</h1>
      <p class="login-subtitle">{{ t('login.chooseProfile') }}</p>
    </div>

    <div class="demo-section">
      <p class="demo-hint">{{ t('login.demoHint') }}</p>
      <div class="demo-grid">
        @for (user of demoUsers; track user.email) {
          <button type="button" class="demo-account" (click)="openLogin(user)">
            <span class="demo-role">{{ t(roleKey(user)) }}</span>
          </button>
        }
      </div>
    </div>

    <div class="login-footer">
      <p class="signup-prompt">
        {{ t('login.noAccount') }}
        <a routerLink="/signup">{{ t('login.createWorkspace') }}</a>
      </p>
      <p class="login-footer-text">
        {{ t('login.footer') }} ·
        <a routerLink="/login/email">{{ t('rbac.login.genericTitle') }}</a>
      </p>
    </div>
  </div>
</div>
